name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Sanitize Source Code and Resolve Dependencies
        run: |
          # 1. First, wipe out any malformed protocol links inside your engine imports
          sed -i 's|://github.com|github.com|g' engine.go
          
          # 2. Initialize the module if it doesn't exist
          if [ ! -f go.mod ]; then
            go mod init libscraper
          fi
          
          # 3. Explicitly pull down and fix the real dependencies now that the file is clean
          go get ://github.com
          go get golang.org/x/net/proxy
          go mod tidy

      - name: Compile Shared Object
        run: |
          # Build highly optimized binary stripped of debug symbols
          GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -ldflags="-s -w" -o libscraper_linux_amd64.so engine.go

      - name: Verify Binary Output
        run: |
          if [ ! -f "libscraper_linux_amd64.so" ] || [ ! -f "libscraper_linux_amd64.h" ]; then
            echo "CRITICAL ERROR: Shared object or header compilation failed."
            exit 1
          fi

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libscraper_linux_amd64_binaries
          path: |
            libscraper_linux_amd64.so
            libscraper_linux_amd64.h
