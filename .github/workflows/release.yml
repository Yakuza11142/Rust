name: Automated Production Binary Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release-assets:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
    - name: Initialize or Tidy Go Modules
      run: |
        if [ ! -f go.mod ]; then
          go mod init libscraper
        fi
        go mod tidy
    - name: Build Shared Object Matrix
      run: |
        GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o libscraper_linux_amd64.so engine.go
    - name: Generate Automated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: libscraper_linux_amd64.so
