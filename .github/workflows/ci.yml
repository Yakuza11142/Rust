name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Clean and Tidy Dependencies
        run: |
          if [ -f go.mod ]; then
            go mod tidy
          else
            go mod init libscraper
            go mod tidy
          fi

      - name: Compile Linux x86_64 Shared Object
        run: |
          GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o libscraper_linux_amd64.so engine.go

      - name: Verify Binary Output
        run: |
          if [ ! -f "libscraper_linux_amd64.so" ]; then
            echo "CRITICAL ERROR: Shared object compilation failed."
            exit 1
          fi
