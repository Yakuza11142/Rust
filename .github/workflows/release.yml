name: Automated Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-assets:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Tidy Dependencies
        run: |
          if [ -f go.mod ]; then
            go mod tidy
          else
            go mod init libscraper
            go mod tidy
          fi

      - name: Build Shared Object Matrix
        run: |
          GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o libscraper_linux_amd64.so engine.go

      - name: Generate Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libscraper_linux_amd64.so
            libscraper_linux_amd64.h
